description: >-
  Un laboratorio sul triangolo rettangolo: fissato un angolo acuto, si ingrandisce o si riduce
  il triangolo e si confrontano triangoli simili, per scoprire che le lunghezze cambiano ma i
  rapporti fra i lati no. Solo dopo, i rapporti prendono il nome di seno, coseno e tangente;
  cambiando l'angolo di riferimento, cateto opposto e adiacente si scambiano.


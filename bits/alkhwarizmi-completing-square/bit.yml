id: alkhwarizmi-completing-square
title: Completing the square in al-Khwarizmi

kind: figure
role: diagram
engine: tikz

status: usable
language: it
created: 2026-09-18

description: >-
  The geometric argument behind x² + 10x = 39 from al-Khwarizmi's Al-jabr: a square of side x,
  two 5×x rectangles, and the 5×5 corner that completes the square of side x + 5.

outputs:
  - format: svg
    file: dist/figure.svg
  - format: pdf
    file: dist/figure.pdf

subjects: [mathematics, history-of-science]
topics: [algebra, quadratic-equations, al-khwarizmi]
levels: [upper-secondary]

provenance:
  - source: "Al-Khwarizmi, Al-kitab al-mukhtasar fi hisab al-jabr wa-l-muqabala (c. 820)"
    notes: >-
      Original figure redrawn from the classic worked example x² + 10x = 39; the diagram is
      an original rendering, not a reproduction of a manuscript.

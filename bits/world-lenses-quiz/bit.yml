id: world-lenses-quiz
title: Cambiare le lenti

kind: interactive
role: game
engine: react

status: usable
default_locale: it
locales: [it]
created: 2026-11-08

description: >-
  Prototipo di un quiz sul mondo presente, per mettere alla prova le immagini che abbiamo di
  società e aree geografiche. Il motore è completo: percorsi pronti, scelta dalla banca o
  estrazione casuale, spiegazione dopo ogni risposta, una domanda aperta per la discussione,
  anno e fonti. Le domande sono invece materiale provvisorio, in revisione editoriale: non una
  raccolta verificata.


description: >-
  La circonferenza goniometrica come carta di riferimento: i 16 angoli notevoli con
  l'equivalenza gradi–radianti (30° = π/6, …) e le coordinate esatte dei punti, che sono
  cos θ e sin θ, con i segni corretti nei quattro quadranti.


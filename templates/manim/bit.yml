id: __BIT_ID__
title: __BIT_TITLE__

kind: video
role: __BIT_ROLE__
engine: manim

status: draft             # draft = local only · usable / curated = published on the site
default_locale: __BIT_LOCALE__   # language of title/description and of the artifact at /bits/__BIT_ID__/
locales: [__BIT_LOCALES__]       # every language the Bit is realised in (docs/localization.md)
created: __BIT_DATE__

# description: One or two sentences on what the animation shows and why.

outputs:
  - format: mp4
    file: dist/__BIT_ID__.mp4
  - format: webp
    file: dist/poster.webp
    description: poster frame (last frame of the animation)

# build:
#   scene: __BIT_CLASS__   # defaults to the first Scene subclass in src/scene.py
#   poster: last           # last | first | <seconds>

# Optional, evolvable taxonomy (discovery uses metadata, not directories):
# subjects: [mathematics]
# topics: []
# levels: [upper-secondary]
tags: [__BIT_TAGS__]        # concept keywords shared with related Bits (docs/bit-spec.md#tags)

# license: CC BY-SA 4.0     # original content inherits the repository default (docs/licensing.md); set only to override
# provenance:               # for third-party or historical material used in the Bit
#   - source: ""
#     author: ""
#     url: ""
#     license: ""
#     modifications: ""

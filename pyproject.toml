[project]
name = "orbbits"
version = "0.1.0"
description = "Personal, local-first authoring system for reusable educational media (Bits) and rich lessons (Orbits)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Flavio Grandin" }]
dependencies = [
    "typer>=0.16",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "rich>=13",
]

[project.scripts]
orbbits = "orbbits.cli:app"
orb = "orbbits.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]
# Heavy authoring engine, installed by default (see [tool.uv]); skip with `uv sync --no-group manim`.
manim = ["manim>=0.19"]

[tool.uv]
default-groups = ["dev", "manim"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbbits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
